# The 15 day scenarios of EVALS.md §4, as hand-authored parameter blocks.
#
# `generate.py` turns each block into a committed 24-row fixture day.  The
# parameters — shape, amplitude, wind profile, precipitation window and
# intensity, UV peak, occasion and flags — are the authored artifact; the rows
# are a deterministic function of them.
#
# Shapes:
#   diurnal    sinusoid with its minimum near sunrise (the ordinary day)
#   ramp_down  frontal passage: flat, then a linear drop, then flat
#   dip        rain-cooled midday trough: down to a trough, back up
#
# `swing = true` marks the six cases of `S_swing` (M3).  `summer_thunderstorm`
# is deliberately not among them: its required clo runs 0.28 → 0.00 against a
# 0.311 floor, so there is nothing to shed and it would contribute ~0 to M3.

