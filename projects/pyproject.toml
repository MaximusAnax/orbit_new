[project]
name = "orbit-projects"
version = "0.1.0"
description = "Workspace root for the twelve products under projects/"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
  "almanac",
  "chessmentor",
  "datasweep",
  "dresscast",
  "ethos",
  "flowlist",
  "formcoach",
  "grailtrader",
  "newsalpha",
  "pointsmax",
  "tickerpress",
  "voicekin",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/evals/fixtures/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI Depends() in defaults is idiomatic
  "RUF012",  # ClassVar annotations not required on Pydantic-adjacent class attrs
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:(almanac|chessmentor|datasweep|dresscast|ethos|flowlist|formcoach|grailtrader|newsalpha|pointsmax|tickerpress|voicekin)\\..*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
