[project]
name = "pointsmax"
version = "0.1.0"
description = "Finds the highest-value redemption path for credit-card points."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
# Live LLMGoalParser only (SCOPE adapter table). Never required by tests or evals.
llm = ["anthropic>=0.40.0"]

[project.scripts]
pointsmax = "pointsmax.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pointsmax"]
