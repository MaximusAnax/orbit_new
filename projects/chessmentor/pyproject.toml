[project]
name = "chessmentor"
version = "0.1.0"
description = "Chess opponent that calibrates to your level and coaches your weaknesses."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.15.0",
    "chess>=1.11.0",
    "numpy>=2.1.0",
]

[project.scripts]
chessmentor = "chessmentor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chessmentor"]
