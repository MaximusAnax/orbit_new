[project]
name = "flowlist"
version = "0.1.0"
description = "Reorders a playlist so consecutive tracks transition seamlessly."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer>=0.15.0",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
# Live adapters only; never required by the core test or eval suites
# (CONVENTIONS.md "Libraries"). Not installed by `uv sync --all-packages`.
audio = ["librosa>=0.10.0"]          # LibrosaLocalAnalyzer (US-6)
tags = ["mutagen>=1.47.0"]           # tag reading for directory import (FR-2)

[project.scripts]
flowlist = "flowlist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowlist"]
